<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>
<body>

<h2>Add / Edit Product</h2>

<form id="productForm" enctype="multipart/form-data">
  <input type="hidden" id="editIndex">

  <input name="name" placeholder="Product Name" required><br><br>
  <input name="category" placeholder="Category" required><br><br>
  <input name="composition" placeholder="Composition" required><br><br>
  <input name="form" placeholder="Form" required><br><br>
  <input name="packing" placeholder="Packing" required><br><br>

  <textarea name="description" placeholder="Product Description" rows="4" required></textarea><br><br>

  <input type="file" name="image"><br><br>

  <button type="submit">Save Product</button>
</form>

<hr>

<h3>Product List</h3>

<table border="1" cellpadding="8">
<thead>
<tr>
  <th>Image</th>
  <th>Name</th>
  <th>Category</th>
  <th>Composition</th>
  <th>Form</th>
  <th>Packing</th>
  <th>Action</th>
</tr>
</thead>

<tbody id="productTable"></tbody>
</table>

<script src="admin.js"></script>
</body>
</html>
