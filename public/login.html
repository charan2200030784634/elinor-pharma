<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login | Elinor Pharma</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0d6efd, #00c6ff);
  overflow: hidden;
}

/* ===== BACKGROUND SHAPES ===== */
.bg-circle {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
}

.bg-circle.one {
  width: 500px;
  height: 500px;
  left: -200px;
  top: -200px;
}

.bg-circle.two {
  width: 350px;
  height: 350px;
  right: -150px;
  bottom: -150px;
}

/* ===== LOGIN CARD ===== */
.login-box {
  position: relative;
  z-index: 2;
  width: 380px;
  background: rgba(255,255,255,0.9);
  border-radius: 16px;
  padding: 40px 35px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== TITLE ===== */
.login-box h2 {
  text-align: center;
  color: #0d6efd;
  margin-bottom: 30px;
  font-weight: 600;
}

/* ===== INPUT GROUP ===== */
.input-group {
  position: relative;
  margin-bottom: 22px;
}

.input-group input {
  width: 100%;
  padding: 14px 14px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 15px;
  background: transparent;
}

.input-group label {
  position: absolute;
  top: 50%;
  left: 14px;
  color: #777;
  font-size: 14px;
  transform: translateY(-50%);
  pointer-events: none;
  transition: 0.3s ease;
  background: white;
  padding: 0 6px;
}

.input-group input:focus {
  outline: none;
  border-color: #0d6efd;
}

.input-group input:focus + label,
.input-group input:not(:placeholder-shown) + label {
  top: -8px;
  font-size: 12px;
  color: #0d6efd;
}

/* ===== FORGOT PASSWORD ===== */
.forgot {
  text-align: right;
  margin-top: -8px;
  margin-bottom: 20px;
}

.forgot a {
  font-size: 13px;
  color: #0d6efd;
  text-decoration: none;
}

.forgot a:hover {
  text-decoration: underline;
}

/* ===== BUTTON ===== */
.login-box button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  background: linear-gradient(135deg, #0d6efd, #00c6ff);
  color: white;
  cursor: pointer;
  transition: 0.3s ease;
}

.login-box button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

/* ===== ERROR ===== */
#error {
  margin-top: 12px;
  text-align: center;
  font-size: 14px;
  color: red;
}

/* ===== FOOTER ===== */
.footer {
  margin-top: 25px;
  text-align: center;
  font-size: 13px;
  color: #555;
}

/* ===== MOBILE ===== */
@media (max-width: 480px) {
  .login-box {
    width: 90%;
    padding: 30px 25px;
  }
}
</style>
</head>

<body>

<div class="bg-circle one"></div>
<div class="bg-circle two"></div>

<div class="login-box">
  <h2>Admin Login</h2>

  <form id="loginForm">
    <div class="input-group">
      <input type="text" name="username" required placeholder=" ">
      <label>Username</label>
    </div>

    <div class="input-group">
      <input type="password" name="password" required placeholder=" ">
      <label>Password</label>
    </div>

    <div class="forgot">
      <a href="#" onclick="forgotPassword()">Forgot password?</a>
    </div>

    <button type="submit">Login</button>
  </form>

  <div id="error"></div>

  <div class="footer">
    Elinor Pharma © 2011
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const data = {
    username: e.target.username.value,
    password: e.target.password.value
  };

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await res.json();

  if (result.success) {
    localStorage.setItem("admin", "true");
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").innerText =
      "Invalid username or password";
  }
});

function forgotPassword() {
  alert("Please contact system administrator to reset your password.");
}
</script>

</body>
</html>
