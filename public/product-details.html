<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Details | Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f9;
  color: #333;
}

/* ================= NAVBAR ================= */
.navbar {
  background: #0d6efd;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.navbar h2 {
  color: #fff;
  margin: 0;
  font-size: 22px;
}

/* menu */
.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
}

.nav-links a:hover {
  text-decoration: underline;
}

/* hamburger */
.menu-toggle {
  display: none;
  font-size: 26px;
  color: white;
  cursor: pointer;
}

/* ================= CONTENT ================= */
.container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 0 20px;
}

.product-card {
  background: #fff;
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
}

.product {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 40px;
}

/* IMAGE */
.product img {
  width: 100%;
  height: 420px;
  object-fit: contain;
  background: #f1f3f6;
  border-radius: 14px;
  padding: 12px;
}

/* INFO */
.info h1 {
  margin-top: 0;
  font-size: 32px;
}

.tags p {
  margin: 6px 0;
  font-size: 15px;
  color: #555;
}

.tags span {
  font-weight: 600;
  color: #222;
}

/* DESCRIPTION */
.about {
  margin-top: 25px;
  background: #f8f9fc;
  padding: 20px;
  border-left: 4px solid #0d6efd;
  border-radius: 10px;
}

.about h3 {
  margin-top: 0;
  font-size: 20px;
}

.about p {
  line-height: 1.6;
  font-size: 15px;
}

/* BUTTON */
.actions {
  margin-top: 25px;
}

.btn {
  display: inline-block;
  padding: 12px 22px;
  background: #0d6efd;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
}

.btn.secondary {
  background: #6c757d;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 20px;
  background: #fff;
  border-top: 1px solid #e5e5e5;
  margin-top: 50px;
  font-size: 14px;
  color: #666;
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {
  .product {
    grid-template-columns: 1fr;
  }

  .product img {
    height: 300px;
  }

  .menu-toggle {
    display: block;
  }

  .nav-links {
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    background: #0d6efd;
    flex-direction: column;
    display: none;
    text-align: center;
    padding: 12px 0;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    padding: 12px 0;
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>Elinor Pharma</h2>

  <div class="menu-toggle" id="menuToggle">☰</div>

  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- PRODUCT -->
<div class="container">
  <div class="product-card">
    <div class="product">

      <img id="img" alt="Product Image">

      <div class="info">
        <h1 id="name"></h1>

        <div class="tags">
          <p><span>Category:</span> <span id="category"></span></p>
          <p><span>Composition:</span> <span id="composition"></span></p>
          <p><span>Form:</span> <span id="form"></span></p>
          <p><span>Packing:</span> <span id="packing"></span></p>
        </div>

        <div class="about">
          <h3>About this product</h3>
          <p id="description"></p>
        </div>

        <div class="actions">
          <a href="products.html" class="btn secondary">← Back to Products</a>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  © 2025 Elinor Pharma. All rights reserved.
</div>

<script>
/* MOBILE MENU */
document.getElementById("menuToggle").onclick = () => {
  document.getElementById("navLinks").classList.toggle("active");
};

/* LOAD PRODUCT BY ID */
const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

fetch("/api/products")
  .then(res => res.json())
  .then(products => {

    // ✅ FIND PRODUCT BY ID (NOT ARRAY INDEX)
    const product = products.find(p => String(p.id) === String(productId));

    if (!product) {
      alert("Product not found");
      window.location.href = "products.html";
      return;
    }

    document.getElementById("img").src = "/uploads/" + product.image;
    document.getElementById("name").innerText = product.name;
    document.getElementById("category").innerText = product.category || "-";
    document.getElementById("composition").innerText = product.composition || "-";
    document.getElementById("form").innerText = product.form || "-";
    document.getElementById("packing").innerText = product.packing || "-";
    document.getElementById("description").innerText =
      product.description || "No description available.";
  })
  .catch(err => {
    console.error(err);
    alert("Failed to load product");
  });
</script>

</body>
</html>
