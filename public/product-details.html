<!DOCTYPE html>
<html>
<head>
  <title>Product Details | Elinor Pharma</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #333;
    }

    /* NAVBAR */
    .navbar {
      background: #0d6efd;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      color: #fff;
      margin: 0;
      font-size: 22px;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
      font-weight: 500;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    /* CONTAINER */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 25px;
    }

    .product-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 35px;
    }

    .product {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 40px;
    }

    /* IMAGE */
    .product img {
      width: 100%;
      height: 420px;
      object-fit: contain;
      background: #f1f3f6;
      border-radius: 14px;
      padding: 15px;
    }

    /* INFO */
    .info h1 {
      margin-top: 0;
      font-size: 34px;
      color: #111;
    }

    .tags {
      margin: 15px 0;
      font-size: 15px;
    }

    .tags p {
      margin: 8px 0;
      color: #555;
    }

    .tags span {
      font-weight: 600;
      color: #222;
    }

    /* DESCRIPTION */
    .about {
      margin-top: 25px;
      background: #f8f9fc;
      padding: 22px;
      border-radius: 12px;
      border-left: 4px solid #0d6efd;
    }

    .about h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .about p {
      line-height: 1.7;
      font-size: 15px;
      color: #555;
    }

    /* BUTTONS */
    .actions {
      margin-top: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-right: 10px;
    }

    .btn.secondary {
      background: #6c757d;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 20px;
      background: #fff;
      border-top: 1px solid #e5e5e5;
      margin-top: 60px;
      font-size: 14px;
      color: #666;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .product {
        grid-template-columns: 1fr;
      }

      .product img {
        height: 300px;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2>Elinor Pharma</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<!-- CONTENT -->
<div class="container">
  <div class="product-card">
    <div class="product">

      <!-- IMAGE -->
      <img id="img">

      <!-- INFO -->
      <div class="info">
        <h1 id="name"></h1>

        <div class="tags">
          <p><span>Category:</span> <span id="category"></span></p>
          <p><span>Composition:</span> <span id="composition"></span></p>
          <p><span>Form:</span> <span id="form"></span></p>
          <p><span>Packing:</span> <span id="packing"></span></p>
        </div>

        <div class="about">
          <h3>About this product</h3>
          <p id="description"></p>
        </div>

        <div class="actions">
          <a href="products.html" class="btn secondary">← Back to Products</a>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  © 2025 Elinor Pharma. All rights reserved.
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

fetch("/api/products")
  .then(res => res.json())
  .then(products => {
    const p = products[id];

    document.getElementById("img").src = "/uploads/" + p.image;
    document.getElementById("name").innerText = p.name;
    document.getElementById("category").innerText = p.category;
    document.getElementById("composition").innerText = p.composition;
    document.getElementById("form").innerText = p.form;
    document.getElementById("packing").innerText = p.packing;
    document.getElementById("description").innerText =
      p.description || "No description available.";
  });
</script>

</body>
</html>
