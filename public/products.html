<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Products | Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
  color: #333;
}

/* ================= NAVBAR ================= */
.navbar {
  background: #0d6efd;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h2 {
  color: #fff;
  margin: 0;
  font-size: 20px;
}

.nav-links {
  display: flex;
  gap: 22px;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
}

/* Hamburger */
.menu-btn {
  display: none;
  font-size: 26px;
  color: white;
  cursor: pointer;
}

/* ================= PAGE HEADER ================= */
.page-title {
  text-align: center;
  margin: 35px 0 8px;
  font-size: 32px;
  font-weight: 600;
}

.page-subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 30px;
  font-size: 16px;
}

/* ================= SEARCH ================= */
.products-wrapper {
  max-width: 1200px;
  margin: auto;
  padding: 0 20px 50px;
}

.search-box {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.search-box input,
.search-box select {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
  flex: 1;
}

/* ================= GRID ================= */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 26px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transition: 0.25s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 26px rgba(0,0,0,0.15);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  background: #eef1f5;
}

.info {
  padding: 18px;
}

.info h3 {
  margin: 0 0 10px;
  font-size: 18px;
}

.info p {
  font-size: 14px;
  margin: 6px 0;
  color: #555;
}

.desc {
  font-size: 13px;
  color: #777;
  margin-top: 6px;
}

.btn {
  display: block;
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  background: #0d6efd;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
}

.btn:hover {
  background: #084298;
}

/* ================= FOOTER ================= */
.footer {
  text-align: center;
  padding: 20px;
  background: white;
  border-top: 1px solid #e5e5e5;
  font-size: 14px;
  color: #666;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

  .menu-btn {
    display: block;
  }

  .nav-links {
    display: none;
    width: 100%;
    flex-direction: column;
    margin-top: 12px;
    text-align: center;
  }

  .nav-links.show {
    display: flex;
  }

  .page-title {
    font-size: 26px;
  }

  .page-subtitle {
    font-size: 14px;
    padding: 0 10px;
  }

  .products {
    grid-template-columns: 1fr;
  }

  .card img {
    height: 170px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2>Elinor Pharma</h2>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<h1 class="page-title">Our Products</h1>
<p class="page-subtitle">
  High-quality pharmaceutical products manufactured with care
</p>

<div class="products-wrapper">
  <div class="search-box">
    <input id="searchInput" placeholder="Search product name..." />
    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>
  </div>

  <div class="products" id="productList"></div>
</div>

<div class="footer">
  © 2011 Elinor Pharma. All rights reserved.
</div>

<script>
function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("show");
}

let allProducts = [];

fetch("/api/products")
  .then(res => res.json())
  .then(products => {
    allProducts = products;
    renderProducts(products);
    populateCategories(products);
  });

function renderProducts(products) {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach((p, index) => {
    const shortDesc = p.description
      ? p.description.substring(0, 90) + "..."
      : "No description available";

    list.innerHTML += `
      <div class="card">
        <img src="/uploads/${p.image}">
        <div class="info">
          <h3>${p.name}</h3>
          <p><b>Category:</b> ${p.category}</p>
          <p><b>Form:</b> ${p.form}</p>
          <p class="desc">${shortDesc}</p>
          <a class="btn" href="product-details.html?id=${index}">
            View Product Details
          </a>
        </div>
      </div>
    `;
  });
}

function populateCategories(products) {
  const select = document.getElementById("categoryFilter");
  const categories = [...new Set(products.map(p => p.category))];

  categories.forEach(cat => {
    const option = document.createElement("option");
    option.value = cat;
    option.textContent = cat;
    select.appendChild(option);
  });
}

document.getElementById("searchInput").addEventListener("input", filterProducts);
document.getElementById("categoryFilter").addEventListener("change", filterProducts);

function filterProducts() {
  const text = document.getElementById("searchInput").value.toLowerCase();
  const category = document.getElementById("categoryFilter").value;

  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(text) &&
    (!category || p.category === category)
  );

  renderProducts(filtered);
}
</script>

</body>
</html>
