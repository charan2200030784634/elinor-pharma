<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  background: #f4f6f9;
}

/* ================= NAVBAR ================= */
.navbar {
  background: #0d6efd;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.navbar h2 {
  color: white;
  font-size: 20px;
}

/* Menu toggle */
.menu-toggle {
  font-size: 28px;
  color: white;
  cursor: pointer;
  display: none;
}

/* Nav links */
.nav-links {
  display: flex;
  gap: 22px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 16px;
}

/* Mobile menu */
@media (max-width: 768px) {
  .menu-toggle {
    display: block;
  }

  .nav-links {
    position: fixed;
    inset: 0;
    background: #0d6efd;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 35px;
    z-index: 999;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    font-size: 22px;
  }

  .close-btn {
    position: absolute;
    top: 18px;
    right: 20px;
    font-size: 34px;
    color: white;
    cursor: pointer;
  }
}

/* ================= PAGE ================= */
.page-title {
  text-align: center;
  margin: 35px 10px 10px;
  font-size: 32px;
}

.page-subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

/* SEARCH */
.products-wrapper {
  max-width: 1200px;
  margin: auto;
  padding: 0 20px 60px;
}

.search-box {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.search-box input,
.search-box select {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  flex: 1;
}

/* PRODUCT GRID */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 25px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  transition: 0.25s ease;
}

.card:hover {
  transform: translateY(-6px);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-body {
  padding: 16px;
}

.card h3 {
  margin-bottom: 8px;
}

.card p {
  font-size: 14px;
  color: #555;
  margin-bottom: 6px;
}

.btn {
  display: block;
  margin-top: 12px;
  text-align: center;
  padding: 10px;
  background: #0d6efd;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

.btn:hover {
  background: #084298;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 20px;
  background: white;
  border-top: 1px solid #ddd;
  color: #666;
}

/* MOBILE TWEAK */
@media (max-width: 768px) {
  .page-title {
    font-size: 26px;
  }

  .products {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>Elinor Pharma</h2>

  <div class="menu-toggle" id="menuToggle">☰</div>

  <nav class="nav-links" id="navLinks">
    <div class="close-btn" id="closeMenu">✕</div>

    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- PAGE HEADER -->
<h1 class="page-title">Our Products</h1>
<p class="page-subtitle">
  High-quality pharmaceutical products manufactured with care
</p>

<div class="products-wrapper">

  <div class="search-box">
    <input id="searchInput" placeholder="Search product name..." />
    <select id="categoryFilter">
      <option value="">All Categories</option>
    </select>
  </div>

  <div class="products" id="productList"></div>
</div>

<footer class="footer">
  © 2011 Elinor Pharma. All rights reserved.
</footer>

<script>
/* MENU */
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
const closeMenu = document.getElementById("closeMenu");

menuToggle.onclick = () => navLinks.classList.add("active");
closeMenu.onclick = () => navLinks.classList.remove("active");

document.querySelectorAll(".nav-links a").forEach(link => {
  link.onclick = () => navLinks.classList.remove("active");
});

/* PRODUCTS */
let allProducts = [];

fetch("/api/products")
  .then(res => res.json())
  .then(data => {
    allProducts = data;
    renderProducts(data);
    loadCategories(data);
  });

function renderProducts(list) {
  const container = document.getElementById("productList");
  container.innerHTML = "";

  if (list.length === 0) {
    container.innerHTML = "<p>No products found.</p>";
    return;
  }

  list.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="/uploads/${p.image}" alt="">
        <div class="card-body">
          <h3>${p.name}</h3>
          <p><b>Category:</b> ${p.category}</p>
          <p>${p.description || ""}</p>
          <a class="btn" href="product-details.html?id=${p.id}">View Details</a>
        </div>
      </div>
    `;
  });
}

function loadCategories(products) {
  const select = document.getElementById("categoryFilter");
  const cats = [...new Set(products.map(p => p.category))];

  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });
}

document.getElementById("searchInput").addEventListener("input", filterProducts);
document.getElementById("categoryFilter").addEventListener("change", filterProducts);

function filterProducts() {
  const text = document.getElementById("searchInput").value.toLowerCase();
  const cat = document.getElementById("categoryFilter").value;

  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(text) &&
    (!cat || p.category === cat)
  );

  renderProducts(filtered);
}
</script>

</body>
</html>
