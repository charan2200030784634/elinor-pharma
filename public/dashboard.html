<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f9;
  color: #333;
}

/* ================= HEADER ================= */
.header {
  background: #0d6efd;
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header h2 {
  margin: 0;
  font-size: 20px;
}

.menu-btn {
  font-size: 26px;
  cursor: pointer;
  display: none;
}

/* ================= SIDEBAR ================= */
.sidebar {
  width: 240px;
  background: white;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 56px;
  padding: 20px;
  box-shadow: 2px 0 10px rgba(0,0,0,0.05);
}

.sidebar a {
  display: block;
  padding: 12px 10px;
  color: #333;
  text-decoration: none;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 15px;
}

.sidebar a:hover {
  background: #e8f0ff;
  color: #0d6efd;
}

/* ================= MAIN ================= */
.main {
  margin-left: 260px;
  padding: 25px;
}

/* ===== STATS ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 25px;
}

.stat-box {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.07);
  text-align: center;
}

.stat-box h3 {
  margin: 0;
  font-size: 15px;
  color: #666;
}

.stat-box p {
  margin-top: 8px;
  font-size: 26px;
  font-weight: bold;
  color: #0d6efd;
}

/* ===== FORM ===== */
.form-card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.07);
  margin-bottom: 25px;
}

.form-card h3 {
  margin-bottom: 15px;
}

.form-card input,
.form-card textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.form-card button {
  width: 100%;
  padding: 12px;
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.form-card button:hover {
  background: #084298;
}

/* ===== TABLE ===== */
.table-card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.07);
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  text-align: center;
  font-size: 14px;
}

thead {
  background: #0d6efd;
  color: white;
}

tbody tr {
  border-bottom: 1px solid #eee;
}

img {
  width: 60px;
  border-radius: 6px;
}

/* ACTION BUTTONS */
.action-btn {
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
}

.edit {
  background: #ffc107;
}

.delete {
  background: #dc3545;
  color: white;
}

/* ================= MOBILE ================= */
@media (max-width: 900px) {

  .menu-btn {
    display: block;
  }

  .sidebar {
    position: fixed;
    left: -260px;
    top: 56px;
    transition: 0.3s;
    z-index: 999;
  }

  .sidebar.show {
    left: 0;
  }

  .main {
    margin-left: 0;
    padding: 18px;
  }

  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>Admin Dashboard</h2>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <a href="#">Dashboard</a>
  <a href="products.html">View Products</a>
  <a href="index.html">Website Home</a>
  <a href="#" onclick="logout()">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

  <!-- STATS -->
  <div class="stats">
    <div class="stat-box">
      <h3>Total Products</h3>
      <p id="totalProducts">0</p>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <h3>Add / Edit Product</h3>

    <form id="productForm" enctype="multipart/form-data">
      <input name="name" placeholder="Product Name" required />
      <input name="category" placeholder="Category" required />
      <input name="composition" placeholder="Composition" />
      <input name="form" placeholder="Form" />
      <input name="packing" placeholder="Packing" />
      <textarea name="description" placeholder="Description"></textarea>
      <input type="file" name="image" />
      <button type="submit">Save Product</button>
    </form>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

</div>

<script src="admin.js"></script>

<script>
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("show");
}

function logout() {
  localStorage.removeItem("admin");
  window.location.href = "login.html";
}
</script>

</body>
</html>
