<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
}

/* ===== NAVBAR ===== */
.navbar {
  background: #0d6efd;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

.navbar h2 {
  color: #fff;
  margin: 0;
  font-size: 20px;
  letter-spacing: 1px;
}

/* Links */
.nav-links {
  display: flex;
  gap: 22px;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 15px;
}

.nav-links a:hover {
  text-decoration: underline;
}

/* Hamburger */
.menu-toggle {
  display: none;
  font-size: 26px;
  color: white;
  cursor: pointer;
}

/* ===== HERO SECTION ===== */
.hero {
  height: 85vh;
  background:
    linear-gradient(
      rgba(13,110,253,0.45),
      rgba(13,110,253,0.55)
    ),
    url("/images/Photos.avif");
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  padding: 20px;
}

.hero-content {
  max-width: 900px;
  animation: fadeUp 1.2s ease;
}

.hero h1 {
  font-size: 44px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.hero a {
  display: inline-block;
  padding: 14px 32px;
  background: white;
  color: #0d6efd;
  font-size: 16px;
  font-weight: 600;
  border-radius: 30px;
  text-decoration: none;
  transition: 0.3s ease;
}

.hero a:hover {
  background: #e8f0ff;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 18px;
  background: #fff;
  border-top: 1px solid #ddd;
  font-size: 14px;
  color: #666;
}

/* ===== ANIMATION ===== */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

  .menu-toggle {
    display: block;
  }

  .nav-links {
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    background: #0d6efd;
    flex-direction: column;
    display: none;
    text-align: center;
    padding: 10px 0;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    padding: 12px 0;
    font-size: 16px;
  }

  .hero {
    height: 70vh;
  }

  .hero h1 {
    font-size: 28px;
  }

  .hero p {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>Elinor Pharma</h2>

  <div class="menu-toggle" id="menuToggle">☰</div>

  <nav class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Welcome to Elinor Pharma</h1>
    <p>
      Delivering high-quality pharmaceutical products with innovation,
      safety, and care for a healthier tomorrow.
    </p>
    <a href="products.html">Explore Our Products</a>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  © 2011 Elinor Pharma. All rights reserved.
</footer>

<!-- JS -->
<script>
  const menuToggle = document.getElementById("menuToggle");
  const navLinks = document.getElementById("navLinks");

  menuToggle.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  });
</script>

</body>
</html>
