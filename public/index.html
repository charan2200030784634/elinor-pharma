<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f4f6f9;
}

/* ===== NAVBAR ===== */
.navbar {
  background: #0d6efd;
  padding: 16px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.navbar h2 {
  color: #fff;
  margin: 0;
  font-size: 22px;
  letter-spacing: 1px;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  margin-left: 25px;
  font-size: 15px;
}

.nav-links a:hover {
  text-decoration: underline;
}

/* ===== HERO SECTION ===== */
.hero {
  height: calc(100vh - 70px);
  background:
    linear-gradient(
      rgba(13,110,253,0.45),
      rgba(13,110,253,0.55)
    ),
    url("/images/Photos.avif");
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
  padding: 20px;
}

.hero-content {
  max-width: 900px;
  animation: fadeUp 1.2s ease;
}

.hero h1 {
  font-size: 46px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 30px;
}

.hero a {
  display: inline-block;
  padding: 14px 32px;
  background: white;
  color: #0d6efd;
  font-size: 16px;
  font-weight: 600;
  border-radius: 30px;
  text-decoration: none;
  transition: 0.3s ease;
}

.hero a:hover {
  background: #e8f0ff;
}

/* ===== ANIMATION ===== */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 18px;
  background: #fff;
  border-top: 1px solid #ddd;
  font-size: 14px;
  color: #666;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {
  .navbar {
    flex-direction: column;
    gap: 10px;
  }

  .hero h1 {
    font-size: 32px;
  }

  .hero p {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <h2>Elinor Pharma</h2>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>Welcome to Elinor Pharma</h1>
    <p>
      Delivering high-quality pharmaceutical products with innovation,
      safety, and care for a healthier tomorrow.
    </p>
    <a href="products.html">Explore Our Products</a>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  © 2011 Elinor Pharma. All rights reserved.
</div>

</body>
</html>
