<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elinor Pharma</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f9;
}

/* ================= NAVBAR ================= */
.navbar {
  background: #0d6efd;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
}

.navbar h2 {
  color: #fff;
  margin: 0;
  font-size: 20px;
}

/* Hamburger */
.menu-toggle {
  font-size: 28px;
  color: white;
  cursor: pointer;
  display: none;
}

/* ===== MOBILE FULLSCREEN MENU ===== */
.nav-links {
  display: flex;
  gap: 22px;
}

.nav-links a {
  color: white;
  text-decoration: none;
  font-size: 15px;
}

/* Mobile menu */
@media (max-width: 768px) {
  .menu-toggle {
    display: block;
  }

  .nav-links {
    position: fixed;
    inset: 0;
    background: #0d6efd;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 35px;
    z-index: 2000;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    font-size: 22px;
  }

  /* EXIT BUTTON */
  .close-btn {
    position: absolute;
    top: 20px;
    right: 22px;
    font-size: 32px;
    color: white;
    cursor: pointer;
  }
}

/* ================= HERO ================= */
.hero {
  height: 100vh;
  background:
    linear-gradient(rgba(13,110,253,0.55), rgba(13,110,253,0.55)),
    url("/images/Photos.avif");
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-top: 70px;
  color: white;
}

.hero-content {
  max-width: 900px;
  animation: fadeUp 1s ease;
}

.hero h1 {
  font-size: 44px;
  margin-bottom: 15px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 30px;
}

.hero a {
  display: inline-block;
  padding: 14px 32px;
  background: white;
  color: #0d6efd;
  font-weight: 600;
  border-radius: 30px;
  text-decoration: none;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 18px;
  background: white;
  border-top: 1px solid #ddd;
  font-size: 14px;
  color: #666;
}

/* Animation */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 768px) {
  .hero h1 {
    font-size: 28px;
  }

  .hero p {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>Elinor Pharma</h2>
  <div class="menu-toggle" id="menuToggle">☰</div>

  <nav class="nav-links" id="navLinks">
    <div class="close-btn" id="closeMenu">✕</div>

    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="products.html">Products</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Welcome to Elinor Pharma</h1>
    <p>
      Delivering high-quality pharmaceutical products with innovation,
      safety, and care for a healthier tomorrow.
    </p>
    <a href="products.html">Explore Our Products</a>
  </div>
</section>

<footer class="footer">
  © 2011 Elinor Pharma. All rights reserved.
</footer>

<script>
const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
const closeMenu = document.getElementById("closeMenu");

menuToggle.onclick = () => {
  navLinks.classList.add("active");
};

closeMenu.onclick = () => {
  navLinks.classList.remove("active");
};

document.querySelectorAll(".nav-links a").forEach(link => {
  link.addEventListener("click", () => {
    navLinks.classList.remove("active");
  });
});
</script>

</body>
</html>
